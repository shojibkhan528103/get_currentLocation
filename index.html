<!DOCTYPE html>
<html>

<body>

    <h4>Click the button to get your coordinates and see your location on the map.</h4>

    <button onclick="getLocation()">Location Map</button>

    <p id="demo"></p>
    <div id="map" style="margin-top:20px;"></div>

    <script>
        const x = document.getElementById("demo");
        const mapDiv = document.getElementById("map");

        function getLocation() {
            if (navigator.geolocation) {
                navigator.geolocation.getCurrentPosition(success, error);
            } else {
                x.innerHTML = "Geolocation is not supported by this browser.";
            }
        }

        function success(position) {
            const lat = position.coords.latitude;
            const lon = position.coords.longitude;

            x.innerHTML = "Latitude: " + lat + "<br>Longitude: " + lon;

            // Show Google Map
            const mapUrl = `https://www.google.com/maps?q=${lat},${lon}&z=15&output=embed`;
            mapDiv.innerHTML = `<iframe width="100%" height="400" src="${mapUrl}" style="border:0;" allowfullscreen></iframe>`;
        }

        function error() {
            alert("Sorry, no position available.");
        }
    </script>

</body>

</html>
